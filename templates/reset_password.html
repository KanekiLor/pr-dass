{% extends "base.html" %}
{% block content %}
<h2>Resetare Parolă</h2>
<p>Introduceti o noua parola pentru contul dvs.</p>

<form method="post">
  <label>Noua Parolă</label><br/>
  <input type="password" name="password" required /><br/><br/>
  
  <label>Confirmati Parola</label><br/>
  <input type="password" name="confirm_password" required /><br/><br/>
  
  <button type="submit">Resetare Parolă</button>
</form>

<p><a href="{{ url_for('login') }}">Înapoi la Login</a></p>
{% endblock %}
