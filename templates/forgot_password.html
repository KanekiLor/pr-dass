{% extends "base.html" %}
{% block content %}
<h2>Recuperare Parolă</h2>
<p>Introduceti email-ul dvs. pentru a primi un link de resetare parolă.</p>

<form method="post">
  <label>Email</label><br/>
  <input name="email" required /><br/><br/>
  <button type="submit">Trimite Link de Resetare</button>
</form>

<p><a href="{{ url_for('login') }}">Înapoi la Login</a></p>
{% endblock %}
